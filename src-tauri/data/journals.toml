# The bundled journal dataset (Story 6.11, FR-19.2, NFR-1/NFR-7): venue
# templates as DATA — the FR-16.8 skills precedent applied to publishing.
# This file ships with the app; ranking and the tier-2 gate read it and
# nothing else — no cloud fetches ever (NFR-1). Community-extensible: the
# shape below is the whole contract (add a [[venue]] block to add a venue;
# add a criterion to deepen a checklist).
#
# Criterion kinds (machine-checkable unless kind = "human"):
#   manuscript_consistency        — board-consistency flags empty (FR-20.4)
#   load_bearing_support          — every pinned claim support-verified (FR-23)
#   references_resolved           — every \cite key resolves: .bib → library
#   compiled_pdf                  — last compile outcome ok
#   statement_present             — structural statement section present
#                                   (statement: data_availability |
#                                    code_availability | ethics | funding |
#                                    conflict_of_interest)
#   abstract_within_words         — \begin{abstract} word count (max: N)
#   main_text_within_words        — total .tex word count (max: N)
#   figures_within                — \includegraphics count (max: N)
#   pages_within                  — compiled PDF pages from the compile log
#                                   (max: N)
#   reference_style               — detected style matches (style: numeric |
#                                    author_year)
#   human                         — human-only item (id + label_en/label_es):
#                                   never auto-passed, never agent-checkable

