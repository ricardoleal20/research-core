[package]
name = "research-core"
version = "0.1.0"
description = "Research Core — local-first research & paper management"
edition = "2024"
rust-version = "1.85"

[lib]
name = "research_core_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "rustls", "webpki-roots"], default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
once_cell = "1"
dirs = "5"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
keyring = { version = "3", features = ["apple-native"] }

[features]
# Enables a simulated LLM/MCP when no provider key is configured (default on).
default = []
