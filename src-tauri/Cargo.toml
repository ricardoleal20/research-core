[package]
name = "research-core"
version = "0.1.0"
description = "Research Core — local-first research & paper management"
edition = "2024"
rust-version = "1.85"

[lib]
name = "research_core_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "rustls", "webpki-roots"], default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
once_cell = "1"
# Bundled data parsing (Story 6.11, FR-19.2): the venue-template dataset
# ships as data/journals.toml — data, not code (NFR-7); already a transitive
# dependency of tauri, so this adds no new crate to the build.
toml = "0.8"
dirs = "5"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
keyring = { version = "3", features = ["apple-native"] }
# Local PDF text extraction for chat attachments (Story 5.5, FR-16.2,
# NFR-12): pure-Rust, runs on the user's machine — extracted text leaves
# only inside the user's chosen provider call.
pdf-extract = "0.7"
# In-process server shell (AD-7): axum inside the Tauri app process, serving
# the built UI + a read-only API over the shared core. tower-http only for
# static file serving.
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
tauri-plugin-notification = "2.4.0"

[dev-dependencies]
# oneshot() router tests for the server shell
tower = { version = "0.5", features = ["util"] }
# the core journey suite (tests/journey.rs): the REAL server shell over TCP
# + the domain writer — same crates the app links, re-declared for the test
# crate (integration tests only see the lib's public API + dev-deps)
reqwest = { version = "0.13", features = ["json", "rustls", "webpki-roots"], default-features = false }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[features]
# Enables a simulated LLM/MCP when no provider key is configured (default on).
default = []
