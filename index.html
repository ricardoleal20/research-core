<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResearchCore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: 'var(--bg)',
            foreground: 'var(--fg)',
            muted: 'var(--muted)',
            border: 'var(--border)',
            card: 'var(--surface)',
            primary: 'var(--accent)',
            primaryForeground: 'var(--accent-foreground)',
            success: '#10b981',
            warning: '#f59e0b',
            destructive: '#f43f5e',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Instrument Serif', 'Georgia', 'serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace'],
          },
          boxShadow: {
            'sm': '0 1px 2px 0 rgb(0 0 0 / 0.04)',
            'DEFAULT': '0 1px 3px 0 rgb(0 0 0 / 0.06), 0 1px 2px -1px rgb(0 0 0 / 0.06)',
            'md': '0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05)',
            'lg': '0 10px 15px -3px rgb(0 0 0 / 0.05), 0 4px 6px -4px rgb(0 0 0 / 0.05)',
            'xl': '0 20px 25px -5px rgb(0 0 0 / 0.05), 0 8px 10px -6px rgb(0 0 0 / 0.05)',
          },
          borderRadius: {
            'xl': '14px',
            'lg': '12px',
            'md': '8px',
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --bg: hsl(0 0% 98%);
      --fg: hsl(240 10% 9%);
      --muted: hsl(240 4% 46%);
      --border: hsl(240 5% 92%);
      --surface: #ffffff;
      --surface-2: hsl(240 5% 96%);
      --surface-3: hsl(240 5% 90%);
      --accent: hsl(211 58% 45%);
      --accent-foreground: #ffffff;
      --success: #10b981;
      --warning: #f59e0b;
      --destructive: #f43f5e;
      color-scheme: light;
    }
    html.dark {
      --bg: hsl(240 10% 7%);
      --fg: hsl(240 5% 96%);
      --muted: hsl(240 5% 60%);
      --border: hsl(240 6% 18%);
      --surface: hsl(240 10% 11%);
      --surface-2: hsl(240 8% 14%);
      --surface-3: hsl(240 8% 20%);
      --accent-foreground: #ffffff;
      color-scheme: dark;
    }
    /* Surface overrides so hardcoded utility classes follow the theme */
    html.dark .bg-white { background-color: var(--surface) !important; }
    html.dark .bg-gray-50 { background-color: var(--surface-2) !important; }
    html.dark .bg-gray-100 { background-color: var(--surface-2) !important; }
    html.dark .hover\:bg-gray-50:hover { background-color: var(--surface-3) !important; }
    html.dark .hover\:bg-gray-100:hover { background-color: var(--surface-3) !important; }
    html.dark .divide-border > * { border-color: var(--border); }
    html.dark .ring-offset-2 { --tw-ring-offset-color: var(--bg); }
    html.dark .bg-gray-200 { background-color: var(--surface-3) !important; }
    html.dark .progress-ring circle:first-of-type { stroke: var(--border); }
    html.dark .bg-emerald-50 { background-color: rgba(16,185,129,0.14) !important; }
    html.dark .text-emerald-700 { color: #34d399 !important; }
    html.dark .bg-amber-50 { background-color: rgba(245,158,11,0.14) !important; }
    html.dark .text-amber-700 { color: #fbbf24 !important; }
    html.dark .bg-rose-50 { background-color: rgba(244,63,94,0.14) !important; }
    html.dark .text-rose-600 { color: #fb7185 !important; }
    html.dark .text-rose-700 { color: #fb7185 !important; }
    html.dark .border-rose-200 { border-color: rgba(244,63,94,0.35) !important; }
    html.dark .bg-orange-50 { background-color: rgba(249,115,22,0.14) !important; }
    html.dark .text-orange-700 { color: #fdba74 !important; }
    html.dark .bg-sky-50 { background-color: rgba(14,165,233,0.14) !important; }
    html.dark .text-sky-700 { color: #7dd3fc !important; }
    html.dark .bg-slate-100 { background-color: rgba(148,163,184,0.14) !important; }
    html.dark .text-slate-700 { color: #cbd5e1 !important; }
    html.dark ::-webkit-scrollbar-thumb { background: hsl(240 4% 30%); }
    html.dark ::-webkit-scrollbar-thumb:hover { background: hsl(240 4% 45%); }
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #app { height: 100%; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    .font-serif { font-family: 'Instrument Serif', Georgia, serif; }
    .font-mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    /* Type scale & rhythm */
    body { font-size: 15px; line-height: 1.6; }
    .display-lg { font-family: 'Instrument Serif', Georgia, serif; font-size: clamp(2.25rem, 5vw, 3.5rem); line-height: 1.05; letter-spacing: -0.02em; font-weight: 400; }
    .display-md { font-family: 'Instrument Serif', Georgia, serif; font-size: clamp(1.75rem, 3vw, 2.5rem); line-height: 1.1; letter-spacing: -0.01em; font-weight: 400; }
    .heading-1 { font-size: 1.75rem; line-height: 1.15; letter-spacing: -0.01em; font-weight: 600; }
    .heading-2 { font-size: 1.25rem; line-height: 1.25; font-weight: 600; }
    .heading-3 { font-size: 1rem; line-height: 1.35; font-weight: 600; }
    .body-lg { font-size: 1rem; line-height: 1.65; }
    .body-sm { font-size: 0.8125rem; line-height: 1.55; }
    .caption { font-size: 0.6875rem; line-height: 1.45; letter-spacing: 0.04em; text-transform: uppercase; }
    .tabular { font-variant-numeric: tabular-nums; }

    /* Utility helpers */
    .glass { background: rgba(255,255,255,0.72); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .ring-focus:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUpDelayed {
      0% { opacity: 0; transform: translateY(12px); }
      30% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(24px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-24px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.05); opacity: 0.35; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }
    @keyframes stream-dot {
      0%,100% { opacity: 0.3; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-3px); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    @keyframes countUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes corePulse {
      0%, 100% { opacity: 0.6; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    @keyframes coreSpin {
      0% { transform: rotate(0deg); opacity: 0.3; }
      100% { transform: rotate(360deg); opacity: 0.6; }
    }
    @keyframes panelDrop {
      0% { opacity: 0; transform: translateY(-24px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes gridMove {
      0% { background-position: 0 0; }
      100% { background-position: 40px 40px; }
    }
    .rc-wizard-wave { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .rc-wizard-wave::before {
      content: ''; position: absolute; left: -25%; right: -25%; top: -10%; height: 70%;
      background: radial-gradient(ellipse at 30% 40%, rgba(255,255,255,0.10), transparent 60%),
                  radial-gradient(ellipse at 70% 60%, rgba(255,255,255,0.07), transparent 55%);
      filter: blur(20px); opacity: 0.7;
      animation: rcWave 18s ease-in-out infinite alternate;
    }
    @keyframes rcWave {
      0%   { transform: translate3d(-3%, 0, 0) scale(1); }
      50%  { transform: translate3d(2%, -2%, 0) scale(1.04); }
      100% { transform: translate3d(3%, 1%, 0) scale(1.02); }
    }
    @keyframes rcSidebarFade { from { opacity: 0; } to { opacity: 1; } }
    .animate-rc-sidebar-fade { animation: rcSidebarFade 260ms ease-out 60ms both; }
    @keyframes rcOrb {
      0%, 80%, 100% { transform: scale(0.55); opacity: 0.35; }
      40% { transform: scale(1); opacity: 1; }
    }
    .rc-orb { width: 7px; height: 7px; border-radius: 9999px; background: var(--accent, hsl(211 58% 45%)); display: inline-block; animation: rcOrb 1.1s ease-in-out infinite; }
    .rc-orb:nth-child(2) { animation-delay: 0.15s; }
    .rc-orb:nth-child(3) { animation-delay: 0.3s; }
    html.rc-no-motion .rc-orb { animation: none; opacity: 0.5; }
        @keyframes rcIntro {
      from { opacity: 0; transform: translateY(14px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .rc-intro { animation: rcIntro 460ms cubic-bezier(0.22, 1, 0.36, 1) both; }
    .rc-intro-1 { animation-delay: 60ms; }
    .rc-intro-2 { animation-delay: 140ms; }
    .rc-intro-3 { animation-delay: 220ms; }
    .rc-intro-4 { animation-delay: 300ms; }
    .rc-intro-5 { animation-delay: 390ms; }
    @keyframes rcAurora {
      0% { transform: translate3d(-2.5%, -1.5%, 0) scale(1); }
      50% { transform: translate3d(2.5%, 2%, 0) scale(1.07); }
      100% { transform: translate3d(-2%, 1.5%, 0) scale(0.98); }
    }
    .rc-ai-aurora {
      position: absolute; left: 50%; top: 52%; width: 30%; max-width: 320px;
      transform: translate(-50%, -50%);
      aspect-ratio: 1 / 1;
      border-radius: 9999px;
      overflow: hidden;
      pointer-events: none; z-index: 0;
    }
    .rc-ai-aurora::before {
      content: ''; position: absolute; inset: -38%;
      background:
        radial-gradient(circle at 50% 50%,
          color-mix(in srgb, var(--accent, hsl(211 58% 45%)) 18%, transparent) 0%,
          color-mix(in srgb, var(--accent, hsl(211 58% 45%)) 9%, transparent) 42%,
          color-mix(in srgb, hsl(188 60% 40%) 5%, transparent) 58%,
          transparent 72%);
      filter: blur(24px);
      animation: rcAurora 16s ease-in-out infinite alternate;
    }
    @keyframes rcFloatUp {
      0% { transform: translateY(0); opacity: 0; }
      12% { opacity: 0.65; }
      88% { opacity: 0.5; }
      100% { transform: translateY(-52px); opacity: 0; }
    }
    .rc-ai-particle { position: absolute; width: 6px; height: 6px; border-radius: 9999px; background: color-mix(in srgb, var(--accent, hsl(211 58% 45%)) 55%, transparent); pointer-events: none; animation: rcFloatUp 6s ease-in-out infinite; }
    /* message bubbles — wall side keeps a little air, other sides hug the text */
    .rc-bubble-user { padding: 0 8px 0 0; line-height: 1.4; }
    .rc-bubble-ai { padding: 0 0 0 8px; line-height: 1.4; }
    html.rc-no-motion .rc-intro, html.rc-no-motion .rc-ai-aurora, html.rc-no-motion .rc-ai-particle { animation: none; }
    html.rc-no-motion .rc-ai-aurora, html.rc-no-motion .rc-ai-particle { display: none; }
    /* Assistant composer: provider/model/effort render as quiet pills on the
       composer surface instead of boxed selects (trigger only — menus keep the
       popover card look). */
    .chat-composer .rc-select > button { background: transparent; border-color: transparent; font-weight: 500; }
    .chat-composer .rc-select > button:hover { background: var(--surface-2) !important; border-color: transparent !important; }
    /* Delayed fade-ups must start hidden (fill "both"), or elements flash
       visible during the stagger delay before snapping back to opacity 0. */
    .animate-fade-up.stagger-1, .animate-fade-up.stagger-2, .animate-fade-up.stagger-3,
    .animate-fade-up.stagger-4, .animate-fade-up.stagger-5, .animate-fade-up.stagger-6 { animation-fill-mode: both; }
    html.dark .rc-wizard-wave::before { opacity: 0.35; }
    html.rc-no-motion .rc-wizard-wave::before { animation: none; }
    @keyframes progressFill {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    @keyframes statusFade {
      0% { opacity: 0; transform: translateY(4px); }
      10% { opacity: 1; transform: translateY(0); }
      90% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-4px); }
    }
    .animate-core-pulse { animation: corePulse 2.5s ease-in-out infinite; }
    .animate-core-spin { animation: coreSpin 8s linear infinite; }
    .animate-panel-drop { animation: panelDrop 500ms cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-grid-move { animation: gridMove 12s linear infinite; }
    .animate-progress-fill { animation: progressFill 3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-status-fade { animation: statusFade 800ms ease-in-out forwards; }
    .ease-out-expo { transition-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
    .ease-in-out-expo { transition-timing-function: cubic-bezier(0.87, 0, 0.13, 1); }
    .animate-fade-up { animation: fadeUp 280ms cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-fade-up-delayed { animation: fadeUpDelayed 360ms cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-slide-right { animation: slideInRight 320ms cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-slide-left { animation: slideInLeft 320ms cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-scale-in { animation: scaleIn 260ms cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-shimmer { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
    .animate-count { animation: countUp 400ms cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .stagger-1 { animation-delay: 40ms; }
    .stagger-2 { animation-delay: 80ms; }
    .stagger-3 { animation-delay: 120ms; }
    .stagger-4 { animation-delay: 160ms; }
    .stagger-5 { animation-delay: 200ms; }
    .stagger-6 { animation-delay: 240ms; }

    /* Hover micro-interactions */
    .hover-lift { transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1), box-shadow 180ms cubic-bezier(0.16, 1, 0.3, 1), border-color 180ms cubic-bezier(0.16, 1, 0.3, 1); }
    .hover-lift:hover { transform: translateY(-2px); box-shadow: 0 8px 24px -6px rgb(0 0 0 / 0.08); border-color: var(--accent); }
    html.dark .hover-lift:hover { box-shadow: 0 8px 24px -6px rgb(0 0 0 / 0.25); }
    .hover-scale { transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1); }
    .hover-scale:hover { transform: scale(1.03); }
    .hover-row { transition: background-color 150ms ease, transform 150ms ease; }
    .hover-row:hover { background-color: var(--surface-2); transform: translateX(2px); }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Progress ring */
    .progress-ring circle { transition: stroke-dashoffset 600ms ease-out; }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: hsl(240 4% 80%); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: hsl(240 4% 65%); }

    /* Toggle switch */
    .switch { appearance: none; width: 40px; height: 22px; border-radius: 999px; background: hsl(240 5% 84%); position: relative; cursor: pointer; transition: background 180ms; }
    .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.15); transition: transform 180ms; }
    .switch:checked { background: var(--accent); }
    .switch:checked::after { transform: translateX(18px); }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
    }
    html.rc-no-motion *, html.rc-no-motion *::before, html.rc-no-motion *::after {
      animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
