  <style>
    :root {
      --bg: hsl(0 0% 98%);
      --fg: hsl(240 10% 9%);
      --muted: hsl(240 4% 46%);
      --border: hsl(240 5% 92%);
      --surface: #ffffff;
      --surface-2: hsl(240 5% 96%);
      --surface-3: hsl(240 5% 90%);
      --accent: hsl(211 58% 45%);
      --accent-foreground: #ffffff;
      --success: #10b981;
      --warning: #f59e0b;
      --destructive: #f43f5e;
      color-scheme: light;
    }
    html.dark {
      --bg: hsl(240 10% 7%);
      --fg: hsl(240 5% 96%);
      --muted: hsl(240 5% 60%);
      --border: hsl(240 6% 18%);
      --surface: hsl(240 10% 11%);
      --surface-2: hsl(240 8% 14%);
      --surface-3: hsl(240 8% 20%);
      --accent-foreground: #ffffff;
      color-scheme: dark;
    }
    /* Surface overrides so hardcoded utility classes follow the theme */
    html.dark .bg-white { background-color: var(--surface) !important; }
    html.dark .bg-gray-50 { background-color: var(--surface-2) !important; }
    html.dark .bg-gray-100 { background-color: var(--surface-2) !important; }
    html.dark .hover\:bg-gray-50:hover { background-color: var(--surface-3) !important; }
    html.dark .hover\:bg-gray-100:hover { background-color: var(--surface-3) !important; }
    html.dark .divide-border > * { border-color: var(--border); }
    html.dark .ring-offset-2 { --tw-ring-offset-color: var(--bg); }
    html.dark .bg-gray-200 { background-color: var(--surface-3) !important; }
    html.dark .progress-ring circle:first-of-type { stroke: var(--border); }
    html.dark .bg-emerald-50 { background-color: rgba(16,185,129,0.14) !important; }
    html.dark .text-emerald-700 { color: #34d399 !important; }
    html.dark .bg-amber-50 { background-color: rgba(245,158,11,0.14) !important; }
    html.dark .text-amber-700 { color: #fbbf24 !important; }
    html.dark .bg-rose-50 { background-color: rgba(244,63,94,0.14) !important; }
    html.dark .text-rose-600 { color: #fb7185 !important; }
    html.dark .text-rose-700 { color: #fb7185 !important; }
    html.dark .border-rose-200 { border-color: rgba(244,63,94,0.35) !important; }
    html.dark .bg-orange-50 { background-color: rgba(249,115,22,0.14) !important; }
    html.dark .text-orange-700 { color: #fdba74 !important; }
    html.dark .bg-sky-50 { background-color: rgba(14,165,233,0.14) !important; }
    html.dark .text-sky-700 { color: #7dd3fc !important; }
    html.dark .bg-slate-100 { background-color: rgba(148,163,184,0.14) !important; }
    html.dark .text-slate-700 { color: #cbd5e1 !important; }
    html.dark ::-webkit-scrollbar-thumb { background: hsl(240 4% 30%); }
    html.dark ::-webkit-scrollbar-thumb:hover { background: hsl(240 4% 45%); }
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #app { height: 100%; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    .font-serif { font-family: 'Instrument Serif', Georgia, serif; }
    .font-mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    /* Type scale & rhythm */
    body { font-size: 15px; line-height: 1.6; }
    .display-lg { font-family: 'Instrument Serif', Georgia, serif; font-size: clamp(2.25rem, 5vw, 3.5rem); line-height: 1.05; letter-spacing: -0.02em; font-weight: 400; }
    .display-md { font-family: 'Instrument Serif', Georgia, serif; font-size: clamp(1.75rem, 3vw, 2.5rem); line-height: 1.1; letter-spacing: -0.01em; font-weight: 400; }
    .heading-1 { font-size: 1.75rem; line-height: 1.15; letter-spacing: -0.01em; font-weight: 600; }
    .heading-2 { font-size: 1.25rem; line-height: 1.25; font-weight: 600; }
    .heading-3 { font-size: 1rem; line-height: 1.35; font-weight: 600; }
    .body-lg { font-size: 1rem; line-height: 1.65; }
    .body-sm { font-size: 0.8125rem; line-height: 1.55; }
    .caption { font-size: 0.6875rem; line-height: 1.45; letter-spacing: 0.04em; text-transform: uppercase; }
    .tabular { font-variant-numeric: tabular-nums; }

    /* Utility helpers */
    .glass { background: rgba(255,255,255,0.72); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .ring-focus:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUpDelayed {
      0% { opacity: 0; transform: translateY(12px); }
      30% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(24px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-24px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.05); opacity: 0.35; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }
    @keyframes stream-dot {
      0%,100% { opacity: 0.3; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-3px); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    @keyframes countUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes corePulse {
      0%, 100% { opacity: 0.6; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    @keyframes coreSpin {
      0% { transform: rotate(0deg); opacity: 0.3; }
      100% { transform: rotate(360deg); opacity: 0.6; }
    }
    @keyframes panelDrop {
      0% { opacity: 0; transform: translateY(-24px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes gridMove {
      0% { background-position: 0 0; }
      100% { background-position: 40px 40px; }
    }
    .rc-wizard-wave { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .rc-wizard-wave::before {
      content: ''; position: absolute; left: -25%; right: -25%; top: -10%; height: 70%;
      background: radial-gradient(ellipse at 30% 40%, rgba(255,255,255,0.10), transparent 60%),
                  radial-gradient(ellipse at 70% 60%, rgba(255,255,255,0.07), transparent 55%);
      filter: blur(20px); opacity: 0.7;
      animation: rcWave 18s ease-in-out infinite alternate;
    }
    @keyframes rcWave {
      0%   { transform: translate3d(-3%, 0, 0) scale(1); }
      50%  { transform: translate3d(2%, -2%, 0) scale(1.04); }
      100% { transform: translate3d(3%, 1%, 0) scale(1.02); }
    }
    @keyframes rcSidebarFade { from { opacity: 0; } to { opacity: 1; } }
    .animate-rc-sidebar-fade { animation: rcSidebarFade 260ms ease-out 60ms both; }
    @keyframes rcOrb {
      0%, 80%, 100% { transform: scale(0.55); opacity: 0.35; }
      40% { transform: scale(1); opacity: 1; }
    }
    .rc-orb { width: 7px; height: 7px; border-radius: 9999px; background: var(--accent, hsl(211 58% 45%)); display: inline-block; animation: rcOrb 1.1s ease-in-out infinite; }
    .rc-orb:nth-child(2) { animation-delay: 0.15s; }
    .rc-orb:nth-child(3) { animation-delay: 0.3s; }
    html.rc-no-motion .rc-orb { animation: none; opacity: 0.5; }
        @keyframes rcIntro {
      from { opacity: 0; transform: translateY(14px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .rc-intro { animation: rcIntro 460ms cubic-bezier(0.22, 1, 0.36, 1) both; }
    .rc-intro-1 { animation-delay: 60ms; }
    .rc-intro-2 { animation-delay: 140ms; }
    .rc-intro-3 { animation-delay: 220ms; }
    .rc-intro-4 { animation-delay: 300ms; }
    .rc-intro-5 { animation-delay: 390ms; }
    @keyframes rcAurora {
      0% { transform: translate(-50%, -50%) translate3d(-2.5%, -1.5%, 0) scale(1); }
      50% { transform: translate(-50%, -50%) translate3d(2.5%, 2%, 0) scale(1.06); }
      100% { transform: translate(-50%, -50%) translate3d(-2%, 1.5%, 0) scale(0.98); }
    }
    .rc-ai-aurora {
      position: absolute; left: 50%; top: 52%; width: 88%; max-width: 760px;
      transform: translate(-50%, -50%);
      aspect-ratio: 1 / 1;
      pointer-events: none; z-index: 0;
      background:
        radial-gradient(circle at 50% 50%,
          color-mix(in srgb, var(--accent, hsl(211 58% 45%)) 22%, transparent) 0%,
          color-mix(in srgb, var(--accent, hsl(211 58% 45%)) 10%, transparent) 42%,
          color-mix(in srgb, hsl(188 60% 40%) 5%, transparent) 60%,
          transparent 74%);
      filter: blur(26px);
      animation: rcAurora 16s ease-in-out infinite alternate;
    }
    @keyframes rcFloatUp {
      0% { transform: translateY(0); opacity: 0; }
      12% { opacity: 0.65; }
      88% { opacity: 0.5; }
      100% { transform: translateY(-52px); opacity: 0; }
    }
    .rc-ai-particle { position: absolute; width: 6px; height: 6px; border-radius: 9999px; background: color-mix(in srgb, var(--accent, hsl(211 58% 45%)) 55%, transparent); pointer-events: none; animation: rcFloatUp 6s ease-in-out infinite; }
    html.rc-no-motion .rc-intro, html.rc-no-motion .rc-ai-aurora, html.rc-no-motion .rc-ai-particle { animation: none; }
    html.rc-no-motion .rc-ai-aurora, html.rc-no-motion .rc-ai-particle { display: none; }
    /* Assistant composer: provider/model/effort render as quiet pills on the
       composer surface instead of boxed selects (trigger only — menus keep the
       popover card look). */
    .chat-composer .rc-select > button { background: transparent; border-color: transparent; font-weight: 500; }
    .chat-composer .rc-select > button:hover { background: var(--surface-2) !important; border-color: transparent !important; }
    /* Delayed fade-ups must start hidden (fill "both"), or elements flash
       visible during the stagger delay before snapping back to opacity 0. */
    .animate-fade-up.stagger-1, .animate-fade-up.stagger-2, .animate-fade-up.stagger-3,
    .animate-fade-up.stagger-4, .animate-fade-up.stagger-5, .animate-fade-up.stagger-6 { animation-fill-mode: both; }
    html.dark .rc-wizard-wave::before { opacity: 0.35; }
    html.rc-no-motion .rc-wizard-wave::before { animation: none; }
    @keyframes progressFill {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    @keyframes statusFade {
      0% { opacity: 0; transform: translateY(4px); }
      10% { opacity: 1; transform: translateY(0); }
      90% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-4px); }
    }
    .animate-core-pulse { animation: corePulse 2.5s ease-in-out infinite; }
    .animate-core-spin { animation: coreSpin 8s linear infinite; }
    .animate-panel-drop { animation: panelDrop 500ms cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-grid-move { animation: gridMove 12s linear infinite; }
    .animate-progress-fill { animation: progressFill 3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-status-fade { animation: statusFade 800ms ease-in-out forwards; }
    .ease-out-expo { transition-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
    .ease-in-out-expo { transition-timing-function: cubic-bezier(0.87, 0, 0.13, 1); }
    .animate-fade-up { animation: fadeUp 280ms cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-fade-up-delayed { animation: fadeUpDelayed 360ms cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-slide-right { animation: slideInRight 320ms cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-slide-left { animation: slideInLeft 320ms cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-scale-in { animation: scaleIn 260ms cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-shimmer { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
    .animate-count { animation: countUp 400ms cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .stagger-1 { animation-delay: 40ms; }
    .stagger-2 { animation-delay: 80ms; }
    .stagger-3 { animation-delay: 120ms; }
    .stagger-4 { animation-delay: 160ms; }
    .stagger-5 { animation-delay: 200ms; }
    .stagger-6 { animation-delay: 240ms; }

    /* Hover micro-interactions */
    .hover-lift { transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1), box-shadow 180ms cubic-bezier(0.16, 1, 0.3, 1), border-color 180ms cubic-bezier(0.16, 1, 0.3, 1); }
    .hover-lift:hover { transform: translateY(-2px); box-shadow: 0 8px 24px -6px rgb(0 0 0 / 0.08); border-color: var(--accent); }
    html.dark .hover-lift:hover { box-shadow: 0 8px 24px -6px rgb(0 0 0 / 0.25); }
    .hover-scale { transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1); }
    .hover-scale:hover { transform: scale(1.03); }
    .hover-row { transition: background-color 150ms ease, transform 150ms ease; }
    .hover-row:hover { background-color: var(--surface-2); transform: translateX(2px); }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Progress ring */
    .progress-ring circle { transition: stroke-dashoffset 600ms ease-out; }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: hsl(240 4% 80%); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: hsl(240 4% 65%); }

    /* Toggle switch */
    .switch { appearance: none; width: 40px; height: 22px; border-radius: 999px; background: hsl(240 5% 84%); position: relative; cursor: pointer; transition: background 180ms; }
    .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.15); transition: transform 180ms; }
    .switch:checked { background: var(--accent); }
    .switch:checked::after { transform: translateX(18px); }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
    }
    html.rc-no-motion *, html.rc-no-motion *::before, html.rc-no-motion *::after {
      animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important;
    }
  </style>
</head>

    // ========== HELPERS ==========
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const badge = (text, color = 'primary') => {
      const map = {
        primary: 'bg-primary/10 text-primary ring-primary/20',
        success: 'bg-emerald-50 text-emerald-700 ring-emerald-600/20',
        warning: 'bg-amber-50 text-amber-700 ring-amber-600/20',
        destructive: 'bg-rose-50 text-rose-700 ring-rose-600/20',
        muted: 'bg-gray-100 text-muted ring-gray-500/10',
        urgent: 'bg-rose-50 text-rose-700 ring-rose-600/20',
        high: 'bg-orange-50 text-orange-700 ring-orange-600/20',
        medium: 'bg-sky-50 text-sky-700 ring-sky-600/20',
        low: 'bg-slate-100 text-slate-700 ring-slate-600/20',
      };
      return `<span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium ring-1 ring-inset hover-scale ${map[color] || map.primary}">${esc(text)}</span>`;
    };
    const btn = ({ label, variant = 'default', size = 'md', iconName, cls = '', onClick = '', type = 'button', id = '' }) => {
      const base = 'inline-flex items-center justify-center gap-2 rounded-md font-medium transition-all duration-150 ring-focus';
      const sizes = { sm: 'px-3 py-1.5 text-xs', md: 'px-4 py-2 text-sm', lg: 'px-5 py-2.5 text-sm' };
      const variants = {
        default: 'bg-primary text-primaryForeground shadow hover:shadow-md hover:-translate-y-0.5 active:scale-[0.98]',
        secondary: 'bg-white text-foreground border border-border shadow-sm hover:bg-gray-50 hover:-translate-y-0.5 active:scale-[0.98]',
        ghost: 'bg-transparent text-foreground hover:bg-gray-100',
        outline: 'bg-transparent text-foreground border border-border hover:bg-gray-50',
        destructive: 'bg-destructive text-white shadow-sm hover:bg-red-600 hover:-translate-y-0.5 active:scale-[0.98]',
      };
      return `<button type="${type}" ${id ? `id="${id}"` : ''} class="${base} ${sizes[size]} ${variants[variant]} ${cls}" ${onClick ? `onclick="${onClick}"` : ''}>${iconName ? icon(iconName, 'w-4 h-4') : ''}${label}</button>`;
    };

    // shadcn-style select: trigger button + popover menu. Keeps a hidden input
    // with the given id so existing read paths (el.value) and onchange handlers
    // keep working — pickRcSelect dispatches a change event on it.
    function rcSelect({ id, options, value, onChange = '', size = 'md', cls = '', dir = 'up', variant = 'default' }) {
      const opts = options.map(o => typeof o === 'string' ? { value: String(o), label: String(o) } : o);
      const val = value === undefined || value === null ? (opts[0] ? opts[0].value : '') : String(value);
      const cur = opts.find(o => o.value === val) || { value: val, label: val };
      const sizes = { xs: 'px-2 py-1 text-[11px]', sm: 'px-2.5 py-1.5 text-xs', md: 'px-4 py-2.5 text-sm' };
      const triggerCls = variant === 'ghost'
        ? 'border-transparent bg-transparent text-muted hover:bg-gray-50 hover:text-foreground'
        : 'border border-border bg-white text-foreground hover:border-primary/40';
      return `
      <div class="rc-select relative ${cls}" data-select-id="${id}">
        <input type="hidden" id="${id}" value="${esc(cur.value)}" ${onChange ? `onchange="${onChange}"` : ''}>
        <button type="button" onclick="toggleRcSelect('${id}', event)" class="flex w-full items-center justify-between gap-1.5 rounded-lg ${triggerCls} ${sizes[size]} text-left focus:outline-none focus:ring-2 focus:ring-primary/30 transition">
          <span class="rc-select-label flex items-center gap-1 min-w-0">${cur.icon ? icon(cur.icon, size === 'xs' ? 'w-3 h-3 shrink-0' : 'w-3.5 h-3.5 shrink-0') : ''}<span class="truncate">${esc(cur.label)}</span></span>
          ${icon('chevronDown', (size === 'xs' ? 'w-3 h-3' : 'w-4 h-4') + ' text-muted shrink-0')}
        </button>
        <div class="rc-select-menu absolute left-0 right-0 ${dir === 'down' ? 'top-full mt-1' : 'bottom-full mb-1'} z-50 hidden max-h-60 overflow-y-auto rounded-lg border border-border bg-white p-1 shadow-lg animate-fade-up">
          ${opts.map(o => `
            <button type="button" onclick="pickRcSelect('${id}', '${esc(o.value)}', event)" class="rc-select-option flex w-full items-center justify-between gap-2 rounded-md px-2 py-1.5 text-sm text-left hover:bg-gray-100 transition ${o.value === cur.value ? 'bg-primary/10 text-primary' : 'text-foreground'}" data-value="${esc(o.value)}">
              <span class="flex items-center gap-1.5 min-w-0">${o.icon ? icon(o.icon, 'w-3.5 h-3.5 shrink-0') : ''}<span class="truncate">${esc(o.label)}</span></span>
              ${o.value === cur.value ? icon('check', 'w-4 h-4 shrink-0') : ''}
            </button>
          `).join('')}
        </div>
      </div>`;
    }
    function toggleRcSelect(id, ev) {
      if (ev) ev.stopPropagation();
      const wrap = document.querySelector(`[data-select-id="${id}"]`);
      const menu = wrap?.querySelector('.rc-select-menu');
      if (!menu) return;
      const willOpen = menu.classList.contains('hidden');
      closeRcSelects();
      if (willOpen) menu.classList.remove('hidden');
    }
    function closeRcSelects() { document.querySelectorAll('.rc-select-menu').forEach(m => m.classList.add('hidden')); }
    function syncRcSelect(wrap, value) {
      const input = wrap.querySelector('input');
      const label = wrap.querySelector('.rc-select-label');
      input.value = value;
      const opt = Array.from(wrap.querySelectorAll('.rc-select-option')).find(o => o.dataset.value === value);
      if (label) label.textContent = opt ? opt.textContent.trim() : value;
      wrap.querySelectorAll('.rc-select-option').forEach(o => {
        const sel = o.dataset.value === value;
        o.classList.toggle('bg-primary/10', sel);
        o.classList.toggle('text-primary', sel);
        o.querySelectorAll('svg').forEach(sv => sv.remove());
        if (sel) o.insertAdjacentHTML('beforeend', icon('check', 'w-4 h-4 shrink-0'));
      });
    }
    function pickRcSelect(id, value, ev) {
      if (ev) ev.stopPropagation();
      const wrap = document.querySelector(`[data-select-id="${id}"]`);
      if (!wrap) return;
      syncRcSelect(wrap, value);
      closeRcSelects();
      wrap.querySelector('input').dispatchEvent(new Event('change', { bubbles: true }));
    }
    function setRcSelectValue(id, value) {
      const wrap = document.querySelector(`[data-select-id="${id}"]`);
      if (wrap) syncRcSelect(wrap, value);
    }
    function rebuildRcSelectOptions(id, options, selectedValue) {
      const wrap = document.querySelector(`[data-select-id="${id}"]`);
      const menu = wrap?.querySelector('.rc-select-menu');
      if (!wrap || !menu) return;
      const opts = options.map(o => typeof o === 'string' ? { value: String(o), label: String(o) } : o);
      menu.innerHTML = opts.map(o => `
        <button type="button" onclick="pickRcSelect('${id}', '${esc(o.value)}', event)" class="rc-select-option flex w-full items-center justify-between gap-2 rounded-md px-2 py-1.5 text-sm text-left hover:bg-gray-100 transition text-foreground" data-value="${esc(o.value)}">
          <span class="truncate">${esc(o.label)}</span>
        </button>
      `).join('');
      syncRcSelect(wrap, selectedValue === undefined || selectedValue === null ? (opts[0] ? opts[0].value : '') : String(selectedValue));
    }
    const card = (children, cls = '') => `<div class="bg-card rounded-xl border border-border shadow-sm hover-lift ${cls}">${children}</div>`;

    // ========== RENDER APP ==========

    function isWelcomeScreen() {

    let _lockShaderRunning = false;
    let _lockShaderRaf = 0;
    let _lockShaderResize = null;
    function startLockShader() {
      const VS = `
        attribute vec2 a_position;
        void main() { gl_Position = vec4(a_position, 0.0, 1.0); }
      `;
      const FS = `
        precision mediump float;
        uniform float u_time;
        uniform vec2 u_resolution;

        float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          float a = hash(i);
          float b = hash(i + vec2(1.0, 0.0));
          float c = hash(i + vec2(0.0, 1.0));
          float d = hash(i + vec2(1.0, 1.0));
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
        }
        float fbm(vec2 p) {
          float v = 0.0;
          float a = 0.5;
          for (int i = 0; i < 5; i++) {
            v += a * noise(p);
            p *= 2.0;
            a *= 0.5;
          }
          return v;
        }
        void main() {
          vec2 uv = gl_FragCoord.xy / u_resolution.xy;
          float t = u_time * 0.04;
          float n = fbm(uv * 2.5 + vec2(t * 0.3, t * 0.1));
          float m = fbm(uv * 3.0 - vec2(t * 0.2, t * 0.25) + n * 0.5);
          vec3 base = vec3(0.082, 0.082, 0.098);
          vec3 blue = vec3(0.19, 0.41, 0.66);
          vec3 teal = vec3(0.20, 0.49, 0.51);
          vec3 indigo = vec3(0.24, 0.32, 0.61);
          vec3 col = base;
          col = mix(col, indigo, smoothstep(0.3, 0.7, m) * 0.35);
          col = mix(col, blue, smoothstep(0.4, 0.8, n) * 0.30);
          col = mix(col, teal, smoothstep(0.35, 0.75, m * n) * 0.20);
          gl_FragColor = vec4(col, 1.0);
        }
      `;
      try {
        const canvas = document.getElementById('lock-shader');
        if (!canvas) return;
        const gl = canvas.getContext('webgl2') || canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (!gl) return;
        if (_lockShaderRaf) { cancelAnimationFrame(_lockShaderRaf); _lockShaderRaf = 0; }
        _lockShaderRunning = false;
        if (_lockShaderResize) { window.removeEventListener('resize', _lockShaderResize); _lockShaderResize = null; }

        function compile(type, src) {
          const s = gl.createShader(type);
          if (!s) return null;
          gl.shaderSource(s, src);
          gl.compileShader(s);
          if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { gl.deleteShader(s); return null; }
          return s;
        }
        const vs = compile(gl.VERTEX_SHADER, VS);
        const fs = compile(gl.FRAGMENT_SHADER, FS);
        if (!vs || !fs) return;
        const prog = gl.createProgram();
        if (!prog) return;
        gl.attachShader(prog, vs);
        gl.attachShader(prog, fs);
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
        gl.useProgram(prog);

        const posLoc = gl.getAttribLocation(prog, 'a_position');
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1.0, -1.0, 3.0, -1.0, -1.0, 3.0]), gl.STATIC_DRAW);
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

        const uTime = gl.getUniformLocation(prog, 'u_time');
        const uRes = gl.getUniformLocation(prog, 'u_resolution');

        function resize() {
          const w = canvas.clientWidth;
          const h = canvas.clientHeight;
          if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
          gl.viewport(0, 0, w, h);
          gl.uniform2f(uRes, w, h);
        }
        _lockShaderResize = resize;
        window.addEventListener('resize', resize);
        resize();

        const motionOff = document.documentElement.classList.contains('rc-no-motion') || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
        if (motionOff) {
          gl.uniform1f(uTime, 0.0);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          return;
        }

        _lockShaderRunning = true;
        const start = performance.now();
        function frame(now) {
          if (!_lockShaderRunning || !document.getElementById('lock-shader')) return;
          gl.uniform1f(uTime, (now - start) * 0.001);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          _lockShaderRaf = requestAnimationFrame(frame);
        }
        _lockShaderRaf = requestAnimationFrame(frame);
      } catch (e) {
        // shader unavailable: leave CSS fallback visible
      }
    }

    function renderLock() {
      const welcome = isWelcomeScreen();
      return `
        <div class="fixed inset-0 overflow-y-auto bg-[hsl(240_10%_9%)] text-white z-50">
          <canvas id="lock-shader" class="pointer-events-none fixed inset-0 w-full h-full" style="z-index:0"></canvas>
          <div class="absolute inset-0 opacity-10" style="background: radial-gradient(circle at 30% 30%, hsl(211 58% 45%), transparent 50%), radial-gradient(circle at 70% 70%, hsl(188 48% 38%), transparent 50%);"></div>

                <p class="mt-4 text-center text-xs text-white/40">${t('lock.firstRunHint')}</p>
              ` : `

                <div class="relative">
                  <input id="lock-input" type="password" class="w-full rounded-lg bg-white/10 border border-white/20 px-4 py-3 pr-10 text-white placeholder-white/40 focus:outline-none focus:border-white/40 transition" placeholder="••••••••">
                  <button type="button" onclick="togglePw('lock-input', this)" aria-label="${t('lock.placeholder')}" class="absolute right-3 top-1/2 -translate-y-1/2 text-white/50 hover:text-white/80 transition">${icon('eye', 'w-4 h-4')}</button>
                </div>

                ${state.settings.vaultHint ? `<p class="mt-3 text-center text-xs text-white/50">${t('lock.hintLabel')}: ${esc(state.settings.vaultHint)}</p>` : ''}
                <p class="mt-4 text-center text-xs text-white/40">${t('lock.idle')}</p>
              `}
            </div>
            ${welcome ? `
            <div class="mt-6 flex items-center justify-center gap-2">
              ${[{code:'en',flag:'🇬🇧',label:t('onboarding.langEn')},{code:'es',flag:'🇪🇸',label:t('onboarding.langEs')},{code:'pt',flag:'🇵🇹',label:t('onboarding.langPt')},{code:'fr',flag:'🇫🇷',label:t('onboarding.langFr')}].map(({code,flag,label}) => `
                <button type="button" onclick="setLang('${code}')" class="inline-flex items-center gap-1.5 rounded-lg border px-2.5 py-1.5 text-xs font-medium transition ${lang === code ? 'border-white/40 bg-white/20 text-white' : 'border-white/10 bg-white/5 text-white/60 hover:bg-white/10'}"><span>${flag}</span><span>${label}</span></button>
              `).join('')}
            </div>
            ` : ''}
          </div>
          </div>
        </div>`;
    }
    function bindLock() {
      const welcome = isWelcomeScreen();
      if (welcome) {
        document.getElementById('lock-btn').onclick = unlockApp;
      } else {
        const unlock = () => {
          const val = document.getElementById('lock-input').value;
          if (state.settings.vaultEnabled && state.settings.vaultPassphrase && val !== state.settings.vaultPassphrase) { shakeLock(); return; }
          unlockApp();
        };
        document.getElementById('lock-btn').onclick = unlock;
        document.getElementById('lock-input').onkeydown = (e) => { if (e.key === 'Enter') unlock(); };
        document.getElementById('lock-input').focus();
      }
      startLockShader();
    }
    function shakeLock() {
      const input = document.getElementById('lock-input');
      input.classList.add('animate-[shake_300ms_ease-in-out]');
      setTimeout(() => input.classList.remove('animate-[shake_300ms_ease-in-out]'), 300);
    }

    const REVIEW_AGENTS = ['Claude Code', 'Codex', 'OpenCode', 'Custom'];
    const REVIEW_AGENT_COMMANDS = { 'Claude Code': 'claude', 'Codex': 'codex', 'OpenCode': 'opencode' };
    const LLM_PROVIDERS = ['OpenAI', 'Anthropic', 'Ollama', 'Personal'];

    function addOnboardingMcp() {
      const name = document.getElementById('mcp-name')?.value.trim();
      const cmd = document.getElementById('mcp-cmd')?.value.trim();
      if (!name) return;
      const id = 'custom-' + name.toLowerCase().replace(/[^a-z0-9]+/g, '-');
      if (state.mcpServers.some(s => s.id === id)) return;
      state.mcpServers.push({ id, name, status: 'connected', health: 'healthy', latency: '—', custom: true, discovered: true, command: cmd || '' });
      const nm = document.getElementById('mcp-name'); if (nm) nm.value = '';
      const cd = document.getElementById('mcp-cmd'); if (cd) cd.value = '';
      render();
    }
    function activateAllMcps() {
      state.mcpServers.forEach(s => { if (s.discovered) { s.status = 'connected'; s.health = 'healthy'; } });
      render();
    }
    function scanMcps() {
      if (state.mcpScanState === 'scanning') return;
      state.mcpScanState = 'scanning';
      render();
      setTimeout(() => {
        state.mcpServers.forEach(s => {
          s.discovered = true;
          if (!s.custom) s.status = 'disconnected';
        });
        state.mcpScanState = 'done';
        render();
      }, 1800);
    }

    function setLlmProvider(provider, prefix) {

            ${rcSelect({ id: modelId, options: (cfg.defaultModels.length ? cfg.defaultModels : [state.settings.llmModel]), value: state.settings.llmModel })}

          </div>
        </div>`;

    async function exploreModels(prefix, btnId) {
      const provider = state.settings.llmProvider;
      const cfg = LLM_PROVIDER_CONFIG[provider];
      const baseId = `${prefix}-base`;
      const keyId = `${prefix}-key`;
      const modelId = `${prefix}-model`;
      const btn = document.getElementById(btnId);
      const base = cfg.hasBaseUrl ? (document.getElementById(baseId)?.value.trim() || cfg.defaultBaseUrl) : cfg.defaultBaseUrl;
      if (!base) return;
      if (btn) { btn.disabled = true; btn.innerHTML = `${icon('bolt', 'w-3.5 h-3.5')} ${t('onboarding.exploring')}`; }
      try {
        const url = `${base.replace(/\/$/, '')}/models`;
        const headers = { 'Accept': 'application/json' };
        if (cfg.hasToken) {
          const keyInput = document.getElementById(keyId);
          if (keyInput && keyInput.value.trim()) headers['Authorization'] = `Bearer ${keyInput.value.trim()}`;
        }
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 8000);
        const res = await fetch(url, { signal: controller.signal, headers });
        clearTimeout(timeout);
        let models = [];
        if (res.ok) {
          const data = await res.json();
          models = (data.data || data.models || data).map(m => typeof m === 'string' ? m : (m.id || m.name || m.model)).filter(Boolean);
        }
        if (models.length) {
          rebuildRcSelectOptions(modelId, models, state.settings.llmModel);
        } else {
          rebuildRcSelectOptions(modelId, [{ value: '', label: t('onboarding.noModels') }], '');
        }
      } catch (e) {
        rebuildRcSelectOptions(modelId, [{ value: '', label: t('onboarding.noModels') }], '');
      }
      if (btn) { btn.disabled = false; btn.innerHTML = `${icon('sparkle', 'w-3.5 h-3.5')} ${t('onboarding.exploreModels')}`; }
    }

    async function pickDataFolder() {
      if (window.showDirectoryPicker) {
        try {
          const dir = await window.showDirectoryPicker();
          state.settings.dataFolder = dir.name;
          render();
          return;
        } catch (e) { /* user cancelled or unsupported */ }
      }
      const input = document.createElement('input');
      input.type = 'file';
      input.webkitdirectory = true;
      input.directory = true;
      input.onchange = (e) => {
        const files = e.target.files;
        if (files && files.length) {
          const path = files[0].webkitRelativePath || files[0].name;
          const folder = path.split('/')[0] || files[0].name;
          state.settings.dataFolder = folder;
          render();
        }
      };
      input.click();
    }

      return `

          ${success ? `<p class="text-sm text-emerald-600 flex items-center gap-2">${icon('check', 'w-4 h-4')} ${t('onboarding.connectionSuccess')}</p>` : ''}
          ${error ? `<p class="text-sm text-red-600 flex items-center gap-2">${icon('x', 'w-4 h-4')} ${esc(state.aiTestMessage || t('onboarding.connectionFailed'))}</p>` : ''}
          ${state.settings.aiSkipped ? `<p class="text-sm text-muted">${t('onboarding.skipAiHint')}</p>` : ''}
        </div>`;
    }

    async function testAiConnection() {
      state.aiTestStatus = 'testing';
      state.aiTestMessage = '';
      state.settings.aiSkipped = false;
      render();
      const provider = state.settings.llmProvider;
      const cfg = LLM_PROVIDER_CONFIG[provider] || LLM_PROVIDER_CONFIG.Personal;
      const keyInput = document.getElementById('onboarding-key');
      const baseInput = document.getElementById('onboarding-base');
      const token = cfg.hasToken ? (keyInput ? keyInput.value.trim() : '') : '';
      const base = cfg.hasBaseUrl ? (baseInput ? baseInput.value.trim() : cfg.defaultBaseUrl) : cfg.defaultBaseUrl;
      try {
        let url, headers = { 'Accept': 'application/json' };
        if (provider === 'Ollama') {
          url = `${base.replace(/\/v1$/, '').replace(/\/$/, '')}/api/tags`;
        } else if (provider === 'Anthropic') {
          url = 'https://api.anthropic.com/v1/models';
          headers['x-api-key'] = token;
          headers['anthropic-dangerous-direct-browser-access'] = '1';
        } else {
          url = `${base.replace(/\/$/, '')}/models`;
          if (token) headers['Authorization'] = `Bearer ${token}`;
        }
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 8000);
        const res = await fetch(url, { headers, signal: controller.signal });
        clearTimeout(timeout);
        if (res.ok) {
          state.aiTestStatus = 'success';
        } else {
          state.aiTestStatus = 'error';
          state.aiTestMessage = `${res.status} ${res.statusText}`;
        }
      } catch (e) {
        state.aiTestStatus = 'error';
        state.aiTestMessage = e.name === 'AbortError' ? 'Timeout' : (e.message || 'Network error');
      }
      render();
    }

    function skipAiStep() {
      state.settings.aiSkipped = true;
      state.aiTestStatus = 'idle';
      state.aiTestMessage = '';
      if (state.onboardingStep < 6) {
        state.onboardingDirection = 1;
        state.onboardingStep++;
        state.maxStepReached = Math.max(state.maxStepReached, state.onboardingStep);
      }
      render();
    }

    function renderInitStep() {
      const accepted = state.initAcceptedProject;
      const effectiveMode = state.initMode;
      return `
        <div class="space-y-5">
          <div>
            <h3 class="text-lg font-semibold">${t('onboarding.initTitle')}</h3>

          </div>
          <div class="grid grid-cols-3 gap-2 rounded-lg border border-border bg-gray-50 p-1">
            ${[['manual', t('onboarding.manualMode')], ['ai', t('onboarding.aiPromptMode')], ['yaml', t('onboarding.yamlMode')]].map(([mode, label]) => `

          ${accepted ? `<div class="rounded-xl border border-emerald-200 bg-emerald-50 p-3 text-sm text-emerald-700 flex items-center gap-2">${icon('check', 'w-4 h-4')} ${t('onboarding.projectAccepted')}: ${esc(accepted.name)}</div>` : ''}
          ${!accepted ? `<p class="text-xs text-muted">${t('onboarding.initAcceptHint')}</p>` : ''}

            </div>
            <div>
              <label class="block text-sm font-medium mb-1.5">${t('onboarding.projectField')}</label>
              <input id="manual-field" value="${esc(state.settings.projectField)}" class="w-full rounded-lg border border-border bg-white px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">

            <div>${btn({ label: state.initLoading ? t('onboarding.generatingProject') : t('onboarding.aiPromptMode'), iconName: state.initLoading ? '' : 'sparkle', onClick: 'generateAiProject()' })}</div>

            <div class="flex flex-wrap items-center gap-3">
              <label class="inline-flex items-center gap-2 rounded-lg border border-border bg-white px-4 py-2 text-sm font-medium cursor-pointer hover:bg-gray-50 transition">${t('common.open')} YAML<input type="file" accept=".yaml,.yml" class="hidden" onchange="loadYamlFile(this)"></label>
              ${btn({ label: state.initLoading ? t('onboarding.parsingYaml') : t('onboarding.yamlMode'), iconName: state.initLoading ? '' : 'sparkle', onClick: 'parseYamlProject()' })}
            </div>
            ${state.initGeneratedProjects.length ? renderGeneratedProjectCard(state.initGeneratedProjects[0]) : ''}

    function renderGeneratedProjectCard(project) {
      return `
        <div class="rounded-xl border border-border bg-white p-4 space-y-3">
          <p class="text-xs font-medium text-muted uppercase tracking-wide">${t('onboarding.projectName')}</p>
          <input value="${esc(project.name)}" oninput="state.initGeneratedProjects[0].name = this.value" class="w-full rounded-lg border border-border bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">
          <input value="${esc(project.field)}" oninput="state.initGeneratedProjects[0].field = this.value" class="w-full rounded-lg border border-border bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">

    function setInitMode(mode) {
      state.initMode = mode;
      render();
    }

    function createProject(name, field) {
      const id = 'p' + Date.now().toString(36);
      const key = name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => (w[0] || '').toUpperCase()).join('') || 'PRJ';
      return { id, name, field, key, refs: 0 };
    }

    function acceptManualProject() {
      const name = document.getElementById('manual-name').value.trim() || state.settings.projectName;
      const field = document.getElementById('manual-field').value.trim() || state.settings.projectField;
      const p = createProject(name, field);
      state.projects = [p];
      state.activeProjectId = p.id;
      state.initAcceptedProject = p;
      state.settings.projectName = name;
      state.settings.projectField = field;
      render();
    }

    function acceptGeneratedProject() {
      const src = state.initGeneratedProjects[0];
      if (!src) return;
      const p = createProject(src.name, src.field);
      state.projects = [p];
      state.activeProjectId = p.id;
      state.initAcceptedProject = p;
      state.settings.projectName = p.name;
      state.settings.projectField = p.field;
      render();
    }

    function simulateAiProject(prompt) {
      const p = prompt.toLowerCase();
      if (p.includes('attention') || p.includes('transformer')) return { name: 'Attention mechanisms in transformers', field: 'Artificial Intelligence' };
      if (p.includes('clinical') || p.includes('bayesian') || p.includes('trial')) return { name: 'Bayesian methods in clinical trials', field: 'Biostatistics' };
      if (p.includes('climate') || p.includes('glacier') || p.includes('ice')) return { name: 'Climate change and glacier dynamics', field: 'Geosciences' };
      if (p.includes('nlp') || p.includes('language')) return { name: 'Natural language processing benchmarks', field: 'Computational Linguistics' };
      return { name: prompt ? prompt.slice(0, 60) : 'Untitled research project', field: 'Interdisciplinary research' };
    }

    function generateAiProject() {
      const prompt = document.getElementById('ai-prompt').value.trim();
      state.initPrompt = prompt;
      state.initLoading = true;
      state.initGeneratedProjects = [];
      render();
      setTimeout(() => {
        state.initLoading = false;
        const suggestion = simulateAiProject(prompt);
        state.initGeneratedProjects = [{ name: suggestion.name, field: suggestion.field }];
        render();
      }, state.settings.animations ? 2200 : 300);
    }

    function loadYamlFile(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        state.initYaml = e.target.result;
        render();
      };
      reader.readAsText(file);
    }

    function parseYamlProject() {
      const yaml = document.getElementById('yaml-input').value.trim();
      state.initYaml = yaml;
      state.initLoading = true;
      state.initGeneratedProjects = [];
      render();
      setTimeout(() => {
        state.initLoading = false;
        let name = 'YAML-derived research project';
        let field = 'Interdisciplinary research';
        const nameMatch = yaml.match(/^name:\s*(.+)$/m) || yaml.match(/^title:\s*(.+)$/m);
        const fieldMatch = yaml.match(/^field:\s*(.+)$/m) || yaml.match(/^area:\s*(.+)$/m);
        if (nameMatch) name = nameMatch[1].trim();
        if (fieldMatch) field = fieldMatch[1].trim();
        state.initGeneratedProjects = [{ name, field }];
        render();
      }, state.settings.animations ? 1800 : 300);
    }

    function goToOnboardingStep(i) {
      if (i > state.maxStepReached || i === state.onboardingStep) return;
      if (state.onboardingStep === 4 && i > 4) {
        const pass = document.getElementById('vault-pass')?.value || '';
        if (state.settings.vaultEnabled && !pass.trim()) { showVaultError(); return; }
        state.settings.vaultPassphrase = pass;
        state.settings.vaultHint = document.getElementById('vault-hint')?.value || '';
        state.settings.idleTimeout = parseInt(document.getElementById('vault-timeout')?.value || '10', 10);
      }
      state.onboardingDirection = i > state.onboardingStep ? 1 : -1;
      state.onboardingStep = i;
      render();
    }

    function bindOnboarding() {
      document.querySelectorAll('input[name="vault"]').forEach(el => el.onchange = (e) => {
        state.settings.vaultEnabled = e.target.value === 'on';
        const fields = document.getElementById('vault-fields');
        if (fields) fields.classList.toggle('hidden', !state.settings.vaultEnabled);
      });
      if (state.onboardingStep === 4) {
        const passInput = document.getElementById('vault-pass');
        const nextBtn = document.getElementById('onboarding-next-btn');
        if (passInput && nextBtn) {
          const syncNext = () => {
            const blocked = state.settings.vaultEnabled && !passInput.value.trim();
            nextBtn.classList.toggle('opacity-50', blocked);
            nextBtn.classList.toggle('pointer-events-none', blocked);
          };
          passInput.addEventListener('input', syncNext);
          document.querySelectorAll('input[name="vault"]').forEach(el => el.addEventListener('change', syncNext));
          syncNext();
        }
      }
      if (state.onboardingStep === 6 && state.mcpScanState === 'idle') scanMcps();
    }

    function clearVaultError() {
      const input = document.getElementById('vault-pass');
      const err = document.getElementById('vault-pass-error');
      if (input) input.classList.remove('border-red-500', 'focus:ring-red-500/30');
      if (err) err.classList.add('hidden');
    }

    function togglePw(id, btn) {
      const input = document.getElementById(id);
      if (!input) return;
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      if (btn) btn.innerHTML = icon(show ? 'eyeOff' : 'eye', 'w-4 h-4');
    }

    function showVaultError() {
      const input = document.getElementById('vault-pass');
      const err = document.getElementById('vault-pass-error');
      if (input) { input.classList.add('border-red-500', 'focus:ring-red-500/30'); input.focus(); }
      if (err) err.classList.remove('hidden');
    }

    function onboardingNext() {
      if (state.onboardingStep === 0 && !state.onboardingLangSelected) return;
      if (state.onboardingStep === 1) state.settings.dataFolder = document.getElementById('data-folder').value || state.settings.dataFolder;
      if (state.onboardingStep === 2) {
        const cfg = LLM_PROVIDER_CONFIG[state.settings.llmProvider] || LLM_PROVIDER_CONFIG.Personal;
        state.settings.llmModel = document.getElementById('onboarding-model')?.value || state.settings.llmModel;
        state.settings.baseUrl = cfg.hasBaseUrl ? (document.getElementById('onboarding-base')?.value || cfg.defaultBaseUrl) : cfg.defaultBaseUrl;
        state.settings.apiKey = cfg.hasToken ? (document.getElementById('onboarding-key')?.value || '') : '';
        state.settings.reviewAgent = document.getElementById('llm-agent')?.value || state.settings.reviewAgent;
        state.settings.reviewAgentCommand = document.getElementById('llm-agent-cmd')?.value || '';
        if (!state.settings.aiSkipped && state.aiTestStatus !== 'success') return;
      }
      if (state.onboardingStep === 3) {
        if (!state.initAcceptedProject) return;
      }
      if (state.onboardingStep === 4) {
        const pass = document.getElementById('vault-pass')?.value || '';
        if (state.settings.vaultEnabled && !pass.trim()) { showVaultError(); return; }
        state.settings.vaultPassphrase = pass;
        state.settings.vaultHint = document.getElementById('vault-hint')?.value || '';
        state.settings.idleTimeout = parseInt(document.getElementById('vault-timeout')?.value || '10', 10);
      }
      if (state.onboardingStep === 5) {
        // appearance already applied live via setAccent / toggle; nothing to read
      }
      if (state.onboardingStep < 6) {
        state.onboardingDirection = 1;
        state.onboardingStep++;
        state.maxStepReached = Math.max(state.maxStepReached, state.onboardingStep);
        render();
      }
    }

    function onboardingBack() {
      if (state.onboardingStep > 0) {
        state.onboardingDirection = -1;
        state.onboardingStep--;
        render();
      }
    }

    function finishOnboarding() {
      // MCP toggles already applied live via toggleMcp; custom servers already added.
      state.onboardingCompleted = true;
      localStorage.setItem('rc-onboarding', '1');
      state.building = true;
      state.buildStarted = false;

    function startBuild() {
      if (state.buildStarted) return;
      state.buildStarted = true;
      const messages = ['buildInitializing', 'buildDashboards', 'buildMcp', 'buildReady'];

        index++;

      update();

        state.buildStarted = false;

    function bindShell() {}
    function toggleSidebar() {
      const wasCollapsed = state.sidebarCollapsed;
      state.sidebarCollapsed = !wasCollapsed;
      // Labels fade in only when this toggle expands the sidebar — otherwise
      // every render() would replay the fade on unrelated state changes.
      state.sidebarFadeLabels = !state.sidebarCollapsed;
      render();
      state.sidebarFadeLabels = false;
      const sb = document.getElementById('sidebar');
      if (!sb || !state.settings.animations) return;
      // render() rebuilds the DOM, so tailwind transition classes alone can't
      // animate between states — do a one-shot width animation instead.
      const fromW = wasCollapsed ? '68px' : '256px';
      const toW = state.sidebarCollapsed ? '68px' : '256px';
      sb.style.transition = 'none';
      sb.style.width = fromW;
      void sb.offsetWidth;
      sb.style.transition = 'width 280ms cubic-bezier(0.16, 1, 0.3, 1)';
      sb.style.width = toW;
      // transitionend also fires for child transitions bubbling up (hover
      // colors etc.) — clean up only on the sidebar's own width transition.
      sb.addEventListener('transitionend', function onSidebarWidthEnd(e) {
        if (e.target !== sb || e.propertyName !== 'width') return;
        sb.style.transition = '';
        sb.style.width = '';
        sb.removeEventListener('transitionend', onSidebarWidthEnd);
      });
    }
    function toggleProjectMenu(e) {
      if (e) e.stopPropagation();
      state.projectMenuOpen = !state.projectMenuOpen;
      render();

            ${state.projects.map(p => `
              <div class="flex items-center gap-1 px-2 py-1">
                <button onclick="switchProject('${p.id}')" class="min-w-0 flex-1 flex items-center justify-between gap-2 px-2 py-1.5 rounded-lg text-left hover:bg-gray-50 transition">
                  <div class="min-w-0">
                    <p class="text-sm font-medium truncate ${p.id === state.activeProjectId ? 'text-primary' : 'text-foreground'}">${esc(p.name)}</p>
                    <p class="text-xs text-muted truncate">${esc(p.field)} · ${p.refs} ${t('project.refs')}</p>
                  </div>
                  ${p.id === state.activeProjectId ? `<span class="text-xs font-medium text-primary shrink-0">${t('project.active')}</span>` : ''}
                </button>
                <button onclick="deleteProject('${p.id}')" title="${t('project.delete')}" aria-label="${t('project.delete')} ${esc(p.name)}" class="shrink-0 p-1.5 rounded-lg text-muted hover:text-red-600 hover:bg-red-50 transition">${icon('trash', 'w-4 h-4')}</button>
              </div>
            `).join('') || `<p class="px-3 py-4 text-sm text-muted text-center">${t('project.empty')}</p>`}
          </div>
          <div class="border-t border-border p-2">
            <button onclick="openNewProject()" class="w-full flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium text-primary hover:bg-primary/10 transition">${icon('plus', 'w-4 h-4')} ${t('project.newProject')}</button>
          </div>
        </div>`;
    }
    function switchProject(id) {
      state.activeProjectId = id;
      state.settings.projectName = activeProject().name;
      state.settings.projectField = activeProject().field;
      const firstChat = state.chats.find(c => c.projectId === id);
      state.activeChatId = firstChat ? firstChat.id : null;
      if (firstChat && firstChat.config) state.chatConfig = { provider: 'Personal', model: null, effort: 'default', contextLimit: '32k', ...firstChat.config };
      state.projectMenuOpen = false;
      navigate('dashboard');
    }
    function deleteProject(id) {
      const p = state.projects.find(x => x.id === id);
      if (!p) return;
      if (!window.confirm(t('project.deleteConfirm').replace('{name}', p.name))) return;
      state.projects = state.projects.filter(x => x.id !== id);
      if (state.activeProjectId === id) state.activeProjectId = state.projects[0]?.id || null;
      if (state.activeProjectId && activeProject()) {
        state.settings.projectName = activeProject().name;
        state.settings.projectField = activeProject().field;
      }
      render();
    }
    function openNewProject() {
      state.projectMenuOpen = false;
      state.newProjectOpen = true;
      state.newProjectMode = null;
      state.newProjectFolder = '';
      render();
    }
    function closeNewProject() { state.newProjectOpen = false; state.newProjectMode = null; state.newProjectFolder = ''; render(); }
    function setNewProjectMode(mode) { state.newProjectMode = mode; render(); }
    async function pickNewProjectFolder() {
      if (window.showDirectoryPicker) {
        try {
          const dir = await window.showDirectoryPicker();
          state.newProjectFolder = dir.name;
          const inp = document.getElementById('new-proj-folder');
          if (inp) inp.value = dir.name;
          return;
        } catch (e) { /* user cancelled or unsupported */ }
      }
      const input = document.createElement('input');
      input.type = 'file';
      input.webkitdirectory = true;
      input.directory = true;
      input.onchange = (e) => {
        const files = e.target.files;
        if (files && files.length) {
          const path = files[0].webkitRelativePath || files[0].name;
          const folder = path.split('/')[0] || files[0].name;
          state.newProjectFolder = folder;
          const inp = document.getElementById('new-proj-folder');
          if (inp) inp.value = folder;
        }
      };
      input.click();
    }
    function createProjectFromDialog() {
      const mode = state.newProjectMode || 'normal';
      let name = '', field = '';
      if (mode === 'normal') {
        name = document.getElementById('new-proj-name')?.value.trim() || '';
        field = document.getElementById('new-proj-field')?.value.trim() || '';
        if (!name) { const el = document.getElementById('new-proj-name'); if (el) el.focus(); return; }
      } else {
        const prompt = document.getElementById('new-proj-prompt')?.value.trim() || '';
        if (!prompt) { const el = document.getElementById('new-proj-prompt'); if (el) el.focus(); return; }
        name = prompt.length > 42 ? prompt.slice(0, 42).trim() + '…' : prompt;
      }
      const folder = document.getElementById('new-proj-folder')?.value.trim() || state.newProjectFolder || state.settings.dataFolder;
      const id = 'p' + (state.projects.length + 1) + Date.now().toString(36).slice(-3);
      state.projects.push({ id, name, field: field || '—', refs: 0, folder });
      state.activeProjectId = id;
      state.settings.projectName = name;
      state.settings.projectField = field || '—';
      state.newProjectOpen = false;
      state.newProjectMode = null;
      state.newProjectFolder = '';
      navigate('dashboard');
    }
    function renderNewProjectDialog() {
      const overlay = document.createElement('div');
      overlay.className = 'rc-modal fixed inset-0 z-[60] overflow-y-auto bg-black/40 backdrop-blur-sm';
      const mode = state.newProjectMode;
      const modes = [
        { key: 'normal', iconName: 'book', label: t('project.npNormal'), desc: t('project.npNormalDesc') },
        { key: 'ai', iconName: 'sparkle', label: t('project.npAi'), desc: t('project.npAiDesc') },
      ];
      const folderBlock = `
        <div>
          <label class="block text-sm font-medium mb-1.5">${t('project.npFolder')}</label>
          <div class="flex gap-2">
            <input id="new-proj-folder" value="${esc(state.newProjectFolder)}" placeholder="${esc(state.settings.dataFolder)}" class="flex-1 rounded-lg border border-border px-4 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-primary/30">
            <button type="button" onclick="pickNewProjectFolder()" class="inline-flex items-center justify-center rounded-lg border border-border px-4 py-2 text-sm font-medium text-foreground hover:bg-gray-50 transition">${t('onboarding.chooseFolder')}</button>
          </div>
          <p class="text-xs text-muted mt-1.5">${t('project.npFolderHint')} <span class="font-mono">${esc(state.settings.dataFolder)}</span></p>
        </div>`;
      let body = '';
      if (!mode) {
        body = `
          <p class="text-sm text-muted mb-4">${t('project.npChooseHow')}</p>
          <div class="space-y-3">
            ${modes.map(m => `
              <button type="button" onclick="setNewProjectMode('${m.key}')" class="w-full flex items-center gap-4 rounded-xl border border-border p-4 text-left hover:border-primary/40 hover:bg-primary/5 transition">
                <span class="shrink-0 flex h-10 w-10 items-center justify-center rounded-lg bg-primary/10 text-primary">${icon(m.iconName, 'w-5 h-5')}</span>
                <span class="min-w-0">
                  <span class="block text-sm font-medium text-foreground">${m.label}</span>
                  <span class="block text-xs text-muted mt-0.5">${m.desc}</span>
                </span>
              </button>

          </div>`;
      } else {
        const modeLabel = mode === 'normal' ? t('project.npNormal') : t('project.npAi');
        const modeForm = mode === 'normal' ? `
          <div><label class="block text-sm font-medium mb-1.5">${t('project.projectName')}</label><input id="new-proj-name" class="w-full rounded-lg border border-border px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30" autofocus></div>
          <div><label class="block text-sm font-medium mb-1.5">${t('project.projectField')}</label><input id="new-proj-field" class="w-full rounded-lg border border-border px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30"></div>`
        : `
          <div><label class="block text-sm font-medium mb-1.5">${t('project.npPromptLabel')}</label><textarea id="new-proj-prompt" rows="4" placeholder="${t('onboarding.promptPlaceholder')}" class="w-full rounded-lg border border-border px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30" autofocus></textarea></div>`;
        body = `
          <div class="space-y-4">
            <div class="flex items-center gap-2 text-xs text-muted">
              <button type="button" onclick="setNewProjectMode(null)" class="inline-flex items-center gap-1 text-primary hover:underline">← ${t('onboarding.back')}</button>
              <span class="font-medium text-foreground">${modeLabel}</span>
            </div>
            ${modeForm}
            ${folderBlock}
          </div>
          <div class="mt-6 flex justify-end gap-2">
            ${btn({ label: t('common.cancel'), variant: 'ghost', onClick: 'closeNewProject()' })}
            ${btn({ label: t('project.create'), variant: 'default', iconName: 'plus', onClick: 'createProjectFromDialog()' })}
          </div>`;
      }
      overlay.innerHTML = `
        <div class="min-h-full flex items-center justify-center p-6">
        <div class="w-full max-w-md rounded-xl border border-border bg-white shadow-xl p-6 animate-scale-in">
          <div class="flex items-center justify-between mb-5"><h3 class="font-semibold text-lg">${t('project.newProject')}</h3><button onclick="closeNewProject()" class="p-1 rounded hover:bg-gray-100">${icon('close', 'w-5 h-5')}</button></div>
          ${body}
        </div>
        </div>`;
      document.body.appendChild(overlay);
      overlay.onclick = (e) => { if (e.target === overlay) closeNewProject(); };
    }

    function renderMain() {
      const main = document.getElementById('main-content');
      if (!main) return;
      let html = '';
      switch (state.view) {
        case 'dashboard': html = renderDashboard(); break;
        case 'references': html = renderReferences(); break;
        case 'review': html = renderReview(); break;
        case 'assistant': html = renderAssistant(); break;
        case 'actions': html = renderActions(); break;
        case 'status': html = renderStatus(); break;
        case 'settings': html = renderSettings(); break;
        default: html = renderDashboard();
      }
      main.innerHTML = `<div class="max-w-7xl mx-auto animate-fade-up">${html}</div>`;
      bindMain();
    }
    function bindMain() {
      if (state.view === 'assistant') bindAssistant();
      if (state.view === 'review') bindReview();
      if (state.view === 'references') bindReferences();
      if (state.view === 'dashboard') bindDashboard();
      if (state.view === 'actions') bindActions();
    }
    function bindDashboard() {
      if (!state.countersAnimated) { state.countersAnimated = true; animateCounters(); }
    }
    function animateCounters() {
      document.querySelectorAll('[data-count]').forEach(el => {
        if (el.dataset.animated) return;
        el.dataset.animated = '1';
        const target = parseInt(el.dataset.count, 10) || 0;
        const suffix = el.textContent.replace(/^-?\d+/, '');
        const dur = 700; const start = performance.now();
        const step = (now) => {
          const p = Math.min((now - start) / dur, 1);
          const eased = 1 - Math.pow(1 - p, 3);
          el.textContent = Math.round(target * eased) + suffix;
          if (p < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      });
    }
    function bindReferences() {
      const search = document.getElementById('ref-search');
      const source = document.getElementById('ref-source');
      if (search) search.oninput = (e) => {
        state.refFilter = e.target.value;
        renderMain();
        const next = document.getElementById('ref-search');
        if (next) { next.focus(); next.setSelectionRange(next.value.length, next.value.length); }
      };
      if (source) source.onchange = (e) => { state.refSourceFilter = e.target.value; renderMain(); };
    }

    // ========== DASHBOARD ==========
    function renderDashboard() {
      const total = state.references.length;
      const reviewed = state.references.filter(r => r.status === 'reviewed').length;
      const toReview = total - reviewed;
      const pct = Math.round((reviewed / total) * 100);
      const radius = 28;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference - (pct / 100) * circumference;
      return `
        <div class="space-y-6">
          <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
              <p class="text-sm text-muted uppercase tracking-[0.06em] font-medium mb-1">${t('dashboard.title')}</p>
              <h1 class="font-serif text-4xl italic">${t('dashboard.greeting')}</h1>
              <p class="text-muted mt-1">${t('dashboard.subtitle')} — <span class="text-foreground font-medium">${esc(state.settings.projectName)}</span></p>
            </div>
            <div class="flex gap-2">
              ${btn({ label: t('dashboard.reviewRun'), variant: 'default', size: 'sm', iconName: 'sparkle', onClick: "navigate('review')" })}

          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            ${card(`
              <div class="p-6 flex items-center gap-6">

                  <svg class="w-full h-full -rotate-90 progress-ring" viewBox="0 0 64 64">
                    <circle cx="32" cy="32" r="${radius}" fill="none" stroke="hsl(240 5% 92%)" stroke-width="8"/>
                    <circle cx="32" cy="32" r="${radius}" fill="none" stroke="url(#grad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"/>
                    <defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="hsl(211 58% 45%)"/><stop offset="100%" stop-color="hsl(188 48% 38%)"/></linearGradient></defs>
                  </svg>
                  <div class="absolute inset-0 flex items-center justify-center text-sm font-bold tabular" data-count="${pct}">${pct}%</div>
                </div>
                <div>
                  <p class="text-muted text-sm">${t('dashboard.progress')}</p>
                  <p class="text-2xl font-semibold mt-1">${reviewed} / ${total}</p>
                  <p class="text-xs text-muted mt-0.5">${toReview} ${t('dashboard.toReview').toLowerCase()}</p>
                </div>
              </div>
            `)}
            ${card(`
              <div class="p-6">
                <p class="text-muted text-sm">${t('dashboard.references')}</p>
                <div class="mt-4 grid grid-cols-3 gap-4 text-center">
                  <div><div class="text-2xl font-semibold tabular" data-count="${total}">${total}</div><div class="text-xs text-muted mt-1">${t('dashboard.total')}</div></div>
                  <div><div class="text-2xl font-semibold text-amber-600 tabular" data-count="${toReview}">${toReview}</div><div class="text-xs text-muted mt-1">${t('dashboard.toReview')}</div></div>
                  <div><div class="text-2xl font-semibold text-emerald-600 tabular" data-count="${reviewed}">${reviewed}</div><div class="text-xs text-muted mt-1">${t('dashboard.reviewed')}</div></div>
                </div>
              </div>
            `)}
            ${card(`
              <div class="p-6">
                <p class="text-muted text-sm">${t('dashboard.mcp')}</p>
                <div class="mt-4 space-y-3">
                  ${state.mcpServers.map(s => `
                    <div class="flex items-center justify-between text-sm">
                      <span class="font-medium">${esc(s.name)}</span>
                      ${badge(s.health === 'healthy' ? t('status.ok') : s.health === 'warning' ? t('status.slow') : t('status.error'), s.health === 'healthy' ? 'success' : s.health === 'warning' ? 'warning' : 'destructive')}
                    </div>
                  `).join('')}
                </div>
              </div>
            `)}
          </div>
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            ${card(`
              <div class="p-6">
                <p class="text-sm font-semibold mb-4">${t('dashboard.recent')}</p>
                <div class="space-y-4">
                  ${state.activity.map(a => `
                    <div class="flex items-start gap-3">
                      <div class="mt-1 h-2 w-2 rounded-full bg-primary"></div>
                      <div>
                        <p class="text-sm">${t('dashboard.activity.' + a.key)}</p>
                        <p class="text-xs text-muted mt-0.5">${t('dashboard.times.' + a.time)}</p>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>
            `, 'lg:col-span-2')}
            ${card(`
              <div class="p-6">
                <p class="text-sm font-semibold mb-4">${t('dashboard.quick')}</p>
                <div class="space-y-2">
                  ${btn({ label: t('dashboard.addAction'), variant: 'secondary', size: 'sm', cls: 'w-full', onClick: 'openAddAction()' })}
                  ${btn({ label: t('status.title'), variant: 'ghost', size: 'sm', cls: 'w-full', onClick: "navigate('status')" })}
                  ${btn({ label: t('assistant.title'), variant: 'ghost', size: 'sm', cls: 'w-full', onClick: "navigate('assistant')" })}
                </div>
              </div>
            `)}
          </div>
        </div>`;
    }

    // ========== REFERENCES ==========

      const sourceFilter = state.refSourceFilter || 'all';
      let rows = state.references.filter(r => r.title.toLowerCase().includes(filter.toLowerCase()) || r.authors.toLowerCase().includes(filter.toLowerCase()));

      const sourceColor = { 'Zotero': 'warning', 'arXiv': 'primary', 'Semantic Scholar': 'success', 'Manual': 'muted', 'MCP': 'medium' };

    // ========== AI REVIEW ==========
    function renderReview() {
      return `
        <div class="space-y-6">
          <div>
            <p class="text-sm text-muted uppercase tracking-[0.06em] font-medium mb-1">${t('review.title')}</p>
            <h1 class="font-serif text-4xl italic">${t('review.title')}</h1>
          </div>
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            ${card(`
              <div class="p-6 space-y-5">
                <h3 class="font-semibold">${t('review.select')}</h3>

    function renderReviewRunning() {

          <div class="relative mb-6">
            <div class="absolute inset-0 rounded-full bg-primary/20 animate-[pulse-ring_2s_ease-in-out_infinite]"></div>
            <div class="relative flex h-16 w-16 items-center justify-center rounded-full bg-primary text-white">${icon('sparkle', 'w-7 h-7')}</div>

          <div class="mt-4 h-1.5 w-64 rounded-full bg-gray-100 overflow-hidden">

    function renderReviewResults() {
      return card(`
        <div class="p-6 lg:col-span-2">
          <h3 class="font-semibold mb-5">${t('review.findings')}</h3>
          <div class="space-y-4">

      if (!ctx) return;

      const dark = document.documentElement.classList.contains('dark');
      const base = dark ? 235 : 22;
      const dot = (x, y, r, a) => { ctx.fillStyle = 'rgba(' + base + ',' + base + ',' + (base + 12) + ',' + a.toFixed(3) + ')'; ctx.beginPath(); ctx.arc(x, y, Math.max(0.4, r), 0, Math.PI * 2); ctx.fill(); };

        const y1 = y * cd - z * sd, z1 = y * sd + z * cd;
        const y2 = y1 * ca - z1 * sa, z2 = y1 * sa + z1 * ca;
        return [x, y2, z2];

      const GHOST = 140, PHI = Math.PI * (3 - Math.sqrt(5));
      for (let i = 0; i < GHOST; i++) {
        const y = 1 - (i / (GHOST - 1)) * 2;
        const rad = Math.sqrt(Math.max(0, 1 - y * y));
        const th = PHI * i;
        const p = rotate(Math.cos(th) * rad, y, Math.sin(th) * rad);
        const depth = (p[2] + 1) / 2;
        const scan = Math.sin((y - s * 1.3) * 3.2);
        const a = (0.08 + 0.22 * depth) * (0.3 + 0.7 * clamp01(scan * 0.55 + 0.45));

          const rad = Math.sqrt(Math.max(0, 1 - w * w));
          const u = clamp01((1 - Math.abs(w)) / 0.1);
          const th = w * Math.PI * TURNS + base2;
          const p = rotate(Math.cos(th) * rad, w, Math.sin(th) * rad);
          const depth = (p[2] + 1) / 2;
          const a = u * (0.45 + 0.55 * depth);

      const f = state.actionFilters;
      const q = (f.search || '').toLowerCase();
      return state.actions.filter(a => {
        if (a.projectId !== state.activeProjectId) return false;
        if (!f.status.includes(a.status)) return false;
        if (!f.priority.includes(a.priority)) return false;
        if (q && !a.title.toLowerCase().includes(q) && !a.description.toLowerCase().includes(q) && !a.key.toLowerCase().includes(q)) return false;
        return true;
      });

    function actionStatusDot(status) {

    function generateActionKey(projectId) {
      const proj = state.projects.find(p => p.id === projectId);
      const prefix = proj?.key || 'RC';
      const existing = state.actions.filter(a => a.projectId === projectId && a.key.startsWith(prefix + '-'));
      const nums = existing.map(a => parseInt(a.key.split('-')[1], 10)).filter(n => !isNaN(n));
      const next = (nums.length ? Math.max(...nums) : 0) + 1;
      return `${prefix}-${next}`;

              ${commands.map((c, i) => `
                <button data-cmd="${i}" onclick="closeCommandPalette(); ${c.action}" class="cmd-item w-full px-4 py-2.5 text-left text-sm hover:bg-gray-50 flex items-center justify-between ${i === 0 ? 'bg-gray-50' : ''}">
                  <span>${esc(c.name)}</span>
                  ${icon('chevron', 'w-4 h-4 text-muted')}
                </button>
              `).join('')}
            </div>
          </div>
        </div>`;
      document.body.appendChild(overlay);

      input.focus();
      input.oninput = () => {
        const q = input.value.toLowerCase();
        document.querySelectorAll('.cmd-item').forEach(item => {
          const match = item.textContent.toLowerCase().includes(q);
          item.style.display = match ? 'flex' : 'none';
          item.classList.toggle('bg-gray-50', false);
        });
        const visible = document.querySelectorAll('.cmd-item[style*="display: flex"], .cmd-item:not([style*="display: none"])');
        if (visible.length) visible[0].classList.add('bg-gray-50');
      };
      input.onkeydown = (e) => {
        if (e.key === 'Escape') closeCommandPalette();
        const items = Array.from(document.querySelectorAll('.cmd-item')).filter(x => x.style.display !== 'none');
        let idx = items.findIndex(x => x.classList.contains('bg-gray-50'));
        if (e.key === 'ArrowDown') { e.preventDefault(); idx = (idx + 1) % items.length; }
        if (e.key === 'ArrowUp') { e.preventDefault(); idx = (idx - 1 + items.length) % items.length; }
        items.forEach(x => x.classList.remove('bg-gray-50'));
        if (items[idx]) items[idx].classList.add('bg-gray-50');
        if (e.key === 'Enter' && items[idx]) { items[idx].click(); }
      };
      overlay.onclick = (e) => { if (e.target === overlay) closeCommandPalette(); };
    }

    async function fetchDoi() {
      const doi = document.getElementById('new-ref-doi')?.value.trim() || '';
      const status = document.getElementById('new-ref-doi-status');
      const btn = document.getElementById('doi-fetch-btn');
      const setStatus = (msg, cls) => { if (status) { status.textContent = msg; status.className = 'mt-1.5 text-xs ' + cls; } };
      if (!doi) { setStatus(t('references.form.doiEmpty'), 'text-red-600'); document.getElementById('new-ref-doi')?.focus(); return; }
      if (btn) { btn.disabled = true; btn.classList.add('opacity-50'); }
      setStatus(t('references.form.fetching'), 'text-muted');
      try {
        const res = await fetch('https://api.crossref.org/works/' + encodeURIComponent(doi));
        if (!res.ok) throw new Error('not found');
        const data = (await res.json()).message;
        const fill = (f, v) => {
          if (!v) return;
          const el = document.getElementById('new-ref-' + f);
          if (el && !el.value.trim()) { el.value = String(v); if (REF_REQUIRED_FIELDS.includes(f)) clearRefError(f); }
        };
        fill('title', (data.title || [])[0]);
        fill('authors', (data.author || []).map(a => [a.given, a.family].filter(Boolean).join(' ')).join(', '));
        fill('journal', (data['container-title'] || [])[0]);
        const year = data.issued?.['date-parts']?.[0]?.[0];
        if (year) setRcSelectValue('new-ref-year', String(year));
        if (data.URL) setRefExtraOpen(true);
        fill('url', data.URL);
        setStatus(t('references.form.fetched'), 'text-emerald-600');
      } catch (e) {
        setStatus(t('references.form.fetchError'), 'text-red-600');
      } finally {
        if (btn) { btn.disabled = false; btn.classList.remove('opacity-50'); }
      }
    }

            <div><p class="text-xs text-muted uppercase tracking-wider mb-1">${t('references.headers.source')}</p>${badge(r.source, r.source === 'Zotero' ? 'warning' : r.source === 'arXiv' ? 'primary' : r.source === 'Semantic Scholar' ? 'success' : r.source === 'MCP' ? 'medium' : 'muted')}</div>
            <div><p class="text-xs text-muted uppercase tracking-wider mb-1">${t('references.headers.tags')}</p><div class="flex flex-wrap gap-2">${r.tags.map(t => badge(t, 'muted')).join('')}</div></div>
            <div><p class="text-xs text-muted uppercase tracking-wider mb-1">${t('references.detail.abstract')}</p><p class="text-sm text-muted leading-relaxed">${esc(r.abstract) || t('references.detail.noAbstract')}</p></div>
            <div class="pt-4 border-t border-border">
              ${btn({ label: t('references.detail.openPdf'), variant: 'secondary', size: 'sm', iconName: 'folder', cls: 'w-full', onClick: `alert(t('references.detail.openPdfAlert')${r.pdfPath ? ` + '\\n' + ${JSON.stringify(r.pdfPath)}` : ''})` })}
            </div>
          </div>
        </div>`;
      document.body.appendChild(overlay);
    }

    // ========== GLOBAL EVENTS ==========
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openCommandPalette();
        return;
      }
      if (e.key === 'Escape') {
        if (state.commandPaletteOpen) { closeCommandPalette(); return; }
        if (state.detailDrawerOpen) { closeDetailDrawer(); return; }
        if (state.addRefOpen) { closeAddRef(); return; }
        if (state.addActionOpen) { closeAddAction(); return; }
        if (state.newProjectOpen) { closeNewProject(); return; }
        if (state.actionDetailOpen) { closeActionDetail(); return; }
        if (state.chatHistoryOpen) { closeChatHistory(); return; }
        if (state.chatSettingsOpen) { closeChatSettings(); return; }
        if (state.chatSlashOpen) { closeSlash(); return; }
        if (state.chatSkillPopoverOpen) { state.chatSkillPopoverOpen = false; render(); return; }
        if (state.chatMoreOpen) { state.chatMoreOpen = false; state.chatMorePanel = null; render(); return; }
        if (state.projectMenuOpen) { state.projectMenuOpen = false; render(); return; }
        closeRcSelects();
      }
    });
    // Close the project dropdown, rc-select menus, and skill popover on outside click
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.rc-select')) closeRcSelects();
      if (state.chatSkillPopoverOpen && !e.target.closest('[data-od-id="chat-skills-zone"]')) {
        state.chatSkillPopoverOpen = false; render();
      }
      if (state.chatMoreOpen && !e.target.closest('[data-od-id="chat-more-zone"]') && !e.target.closest('.rc-select')) {
        state.chatMoreOpen = false; state.chatMorePanel = null; render();
      }
      if (state.chatSlashOpen && !e.target.closest('#chat-composer')) { state.chatSlashOpen = false; state.chatSlashQuery = ''; softRender(); }
      if (state.projectMenuOpen && !e.target.closest('[onclick*="toggleProjectMenu"]') && !e.target.closest('.relative > .absolute')) {
        state.projectMenuOpen = false; render();
      }
    });

    // Apply persisted appearance preferences before first render
    applyAccent();
    applyTheme();
    applyMotion();

    // Initial render
    render();
  </script>
</body>
</html>
